name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (blocks on any finding)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --redact --config .gitleaks.toml --verbose

  dependencies:
    runs-on: ubuntu-latest
    continue-on-error: true   # reported, not blocking, until the baseline is clean
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        run: __AUDIT_CMD__
